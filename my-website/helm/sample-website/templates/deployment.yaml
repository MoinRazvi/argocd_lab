apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-website

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: my-website

  template:
    metadata:
      labels:
        app: my-website

    spec:
      containers:
        - name: my-website

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}