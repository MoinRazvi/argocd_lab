apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: my-website
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/MoinRazvi/my-website.git
    targetRevision: main
    path: helm/sample-website

  destination:
    server: https://kubernetes.default.svc
    namespace: my-website

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true